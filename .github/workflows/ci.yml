name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée annule la vérification précédente sur la même branche :
# inutile de payer deux fois pour un code déjà remplacé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices, suffisantes pour cette tâche : le formatage, le typage, le lint
  # et les tests unitaires n'ouvrent aucune connexion.
  #
  # ⚠️ Le BUILD, lui, interroge vraiment la base — il pré-génère les pages statiques
  # et les fiches des meilleures ventes. Il vit donc dans la tâche « database », qui
  # dispose d'un vrai PostgreSQL. L'avoir placé ici, avec une URL factice, rendait le
  # CI rouge en permanence.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci'

jobs:
  verify:
    name: Typage, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm db:generate

      - name: Vérifier le formatage
        run: pnpm format:check

      - name: Vérifier le typage
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests unitaires
        run: pnpm test

  # Le schéma doit être valide et les migrations doivent s'appliquer sur une base
  # vierge. C'est ce qui empêche une migration cassée d'atteindre la production.
  #
  # Le build se fait ici, et non dans la tâche précédente, parce qu'il a besoin d'une
  # base joignable : c'est le seul endroit du CI qui reproduit ce que fait réellement
  # Vercel au déploiement.
  database:
    name: Migrations, amorçage et build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: beralshopp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/beralshopp_ci'
      DIRECT_URL: 'postgresql://ci:ci@localhost:5432/beralshopp_ci'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Valider le schéma
        run: pnpm --filter @beralshopp/db exec prisma validate

      - name: Appliquer les migrations
        run: pnpm --filter @beralshopp/db run migrate:deploy

      - name: Amorcer les données de référence
        run: pnpm db:seed

      # Contrôle décisif : crée un produit, cherche « ecouteur bluetooth » sans accent
      # et vérifie qu'il remonte. Détecte toute régression des triggers de recherche,
      # de la séquence des commandes ou des contraintes anti-survente.
      - name: Contrôle de santé du schéma
        run: pnpm db:verify

      # Dernière étape : ce que fera Vercel, sur une base réelle et amorcée.
      - name: Build
        run: pnpm build
